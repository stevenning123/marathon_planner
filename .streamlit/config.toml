[theme]
# These five colors repeat PALETTE in app.py: primaryColor = accent, backgroundColor = bg,
# secondaryBackgroundColor = card, textColor = ink, borderColor = card_border. Change both together.
base = "light"
primaryColor = "#C2410C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FD"
textColor = "#13233F"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
borderColor = "#DDE4F0"
baseRadius = "10px"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
